<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14532d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="양벌돔">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <title>양벌 테니스 돔 빈 코트 찾기</title>
  <link rel="stylesheet" href="style.css?v=3">
</head>
<body>
  <header class="top">
    <div class="wrap">
      <h1>🎾 양벌 테니스 돔 <span>빈 코트 찾기</span></h1>
      <a class="book" id="bookLink" href="https://gjcenter.gjcs.or.kr/fmcs/3" target="_blank" rel="noopener">예약하러 가기 ↗</a>
    </div>
  </header>

  <main class="wrap">
    <section class="toolbar">
      <div class="month-nav">
        <button id="prev" aria-label="이전 달">‹</button>
        <h2 id="monthTitle">-</h2>
        <button id="next" aria-label="다음 달">›</button>
      </div>
      <div class="opts">
        <label class="switch"><input type="checkbox" id="showEmpty"> 온라인 신청 안 되는 미예약 자리도 표시</label>
        <button id="refresh" class="ghost">새로고침</button>
      </div>
    </section>

    <div class="legend">
      <span><i class="dot open"></i>예약가능</span>
      <span><i class="dot empty"></i>미예약(온라인 신청 불가)</span>
      <span><i class="dot booked"></i>예약됨</span>
      <span><i class="dot closed"></i>휴관/지난시간</span>
    </div>

    <p id="status" class="status">불러오는 중…</p>

    <section class="opening" id="opening" hidden>
      <div class="op-head">
        <strong id="opTitle"></strong>
        <span id="opBadge" class="op-badge"></span>
      </div>
      <p id="opNote" class="op-note"></p>
      <details>
        <summary>예측 규칙 · 검증 기록</summary>
        <ul id="opRules" class="op-rules"></ul>
      </details>
    </section>

    <section class="calendar" id="calendar" aria-label="월 달력"></section>

    <section class="detail" id="detail" hidden>
      <h3 id="detailTitle"></h3>
      <p id="reason" class="reason" hidden></p>
      <div id="summary" class="summary"></div>
      <div class="grid-scroll"><table id="grid" class="grid"></table></div>
    </section>

    <footer class="foot">
      비공식 조회 도구입니다. 데이터 출처: 광주시스포츠통합센터 온라인예약시스템 (약 3분 간격 갱신).<br>
      실제 예약은 공식 사이트에서 로그인 후 진행하세요.
    </footer>
  </main>

  <script src="app.js?v=3"></script>
</body>
</html>
