# 서버 없이 GitHub Pages로 배포하는 방식 (10분마다 데이터를 새로 받아 정적 JSON으로 게시)
name: Update court data & deploy Pages

# 기본은 수동 실행만. GitHub Pages로 쓰려면 아래 schedule 주석을 풀고 Settings > Pages 를 GitHub Actions 로 설정
on:
  workflow_dispatch:
  # schedule:
  #   - cron: "*/10 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python server.py --dump
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
